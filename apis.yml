name: caimitech
description: >-
  caimitech.com is the domain of Wacai (挖财, Hangzhou Wacai Network Technology
  Co.), a Chinese personal-finance and wealth-management company founded in 2009
  that offers accounting/bookkeeping apps, personal financial management (PFM)
  tools, wealth-management services, and credit solutions. Its developer surface
  is the Wacai Open Platform (挖财开放平台) — an HMAC-signed API gateway addressed by
  (api_name, api_version) pairs rather than REST paths, with first-party client
  SDKs in Java (published to Maven Central under com.wacai), Node.js, PHP, Go, and
  C#, plus a separate topic-based message gateway (pull/ack). Access uses an
  app_key/app_secret credential with MAC or RSA request signing and an optional
  token service. No OpenAPI document is published; this profile was enriched from
  the provider's public GitHub SDKs and package registries.
